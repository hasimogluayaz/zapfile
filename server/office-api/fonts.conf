<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Family names Word writes for single-weight font installs, mapped to the real families. -->
<fontconfig>
  <alias binding="same"><family>Montserrat Regular</family><prefer><family>Montserrat</family></prefer></alias>
  <alias binding="same"><family>Montserrat Italic</family><prefer><family>Montserrat</family></prefer></alias>
  <alias binding="same"><family>Open Sans Regular</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Roboto Regular</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>Lato Regular</family><prefer><family>Lato</family></prefer></alias>
  <!-- Windows UI fonts without a free metric-compatible twin: closest open designs. -->
  <alias binding="same"><family>Segoe UI</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Symbol</family><prefer><family>Noto Sans Symbols</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
